<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKE-UM7 (ファイブ的)</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --primary: #d9381e;
            --secondary: #2980b9;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 6px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .app-header h1 {
            text-align: center;
            margin: 4px 0 8px 0;
            font-size: 1.3rem;
        }

        .timer-card {
            background: #2c3e50;
            color: #ffffff;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            margin-bottom: 8px;
        }

        .timer-card h2 { margin: 0; font-size: 0.8rem; color: #bdc3c7; }
        .timer-display { font-size: 2.2rem; font-weight: bold; font-family: monospace; margin: 2px 0; }
        .timer-controls { display: flex; gap: 6px; }
        .btn-timer { flex: 1; padding: 6px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-start { background: #ffffff; color: #2c3e50; }
        .btn-reset { background: rgba(255,255,255,0.2); color: #ffffff; }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        .btn-analysis {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-action-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .card-title { font-size: 0.9rem; font-weight: bold; color: var(--primary); }
        .btn-close { background: none; border: none; font-size: 1rem; color: var(--text-sub); cursor: pointer; }

        .round-row {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            gap: 2px;
        }

        .round-label {
            font-weight: bold;
            font-size: 0.75rem;
            width: 22px;
            flex-shrink: 0;
        }

        .arrows-container {
            display: flex;
            gap: 2px;
            flex: 1;
            justify-content: space-between;
            min-width: 0;
        }

        .arrow-group {
            display: flex;
            gap: 1px;
            background: #f1f5f9;
            padding: 1px;
            border-radius: 3px;
            flex: 1;
            justify-content: space-between;
        }

        .btn-score {
            flex: 1;
            min-width: 0;
            height: 22px;
            border-radius: 2px;
            border: none;
            background: transparent;
            font-weight: bold;
            font-size: 0.65rem;
            cursor: pointer;
            padding: 0;
            color: #475569;
        }

        .btn-score.active {
            background: var(--primary);
            color: #ffffff;
        }

        .round-total {
            width: 20px;
            text-align: right;
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--secondary);
            flex-shrink: 0;
        }

        .set-total-box {
            background: #f8fafc;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            margin-top: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 12px; padding: 16px; width: 85%; max-width: 360px; z-index: 1001; }
        .modal-title { font-size: 1rem; font-weight: bold; margin-bottom: 8px; border-bottom: 2px solid var(--primary); }
        .btn-modal-close { width: 100%; padding: 8px; background: var(--text-main); color: white; border: none; border-radius: 6px; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>TAKE-UM7 (ファイブ的)</h1>
    </div>

    <div class="timer-card">
        <h2>競技用タイマー (3分)</h2>
        <div class="timer-display" id="timerDisplay">03:00</div>
        <div class="timer-controls">
            <button class="btn-timer btn-start" id="timerStartBtn" onclick="toggleTimer()">開始</button>
            <button class="btn-timer btn-reset" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <div class="analysis-grid">
        <button class="btn-analysis" onclick="runAnalysis('recent')">📊 直近10セット</button>
        <button class="btn-analysis" onclick="runAnalysis('month')">📅 今月の成績</button>
        <button class="btn-analysis" onclick="runAnalysis('year')">🏆 今年の成績</button>
        <button class="btn-analysis" onclick="runAnalysis('all')">📝 全履歴確認</button>
    </div>

    <button class="btn-action-primary" onclick="startNewSet()">新しい修練セットを開始</button>

    <div id="cardsArea"></div>
</div>

<div class="modal-overlay" id="overlay" onclick="closeAlert()"></div>
<div class="modal-content" id="customAlert">
    <div class="modal-title" id="alertTitle">お知らせ</div>
    <div id="alertMessage" style="font-size:0.85rem; line-height:1.4;"></div>
    <button class="btn-modal-close" onclick="closeAlert()">閉じる</button>
</div>

<script>
    let timerInterval = null, timeLeft = 180, isRunning = false;

    function updateTimerDisplay() {
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }

    function toggleTimer() {
        const btn = document.getElementById('timerStartBtn');
        if (isRunning) {
            clearInterval(timerInterval); isRunning = false; btn.innerText = '再開';
        } else {
            isRunning = true; btn.innerText = '一時停止';
            timerInterval = setInterval(() => {
                if (timeLeft > 0) { timeLeft--; updateTimerDisplay(); }
                else { clearInterval(timerInterval); isRunning = false; btn.innerText = '開始'; showAlert('時間終了', '3分が経過しました！'); }
            }, 1000);
        }
    }

    function resetTimer() {
        clearInterval(timerInterval); isRunning = false; timeLeft = 180;
        document.getElementById('timerStartBtn').innerText = '開始'; updateTimerDisplay();
    }

    function showAlert(title, msg) {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMessage').innerHTML = msg;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('customAlert').style.display = 'block';
    }

    function closeAlert() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('customAlert').style.display = 'none';
    }

    const STORAGE_KEY = 'fukiya_sets_five';
    let sets = [];

    function loadData() {
        try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) sets = JSON.parse(raw); } catch(e) { sets = []; }
    }

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(sets)); }

    function runAnalysis(type) {
        let filtered = sets.filter(s => s.total > 0);
        const now = new Date();
        if (type === 'month') {
            const currentMonth = `${now.getFullYear()}/${now.getMonth() + 1}`;
            filtered = filtered.filter(s => s.time.startsWith(currentMonth));
        } else if (type === 'year') {
            const currentYear = `${now.getFullYear()}/`;
            filtered = filtered.filter(s => s.time.startsWith(currentYear));
        } else if (type === 'recent') {
            filtered = filtered.slice(-10);
        }

        if (filtered.length === 0) { showAlert('成績データ', '該当する完了データがありません。'); return; }

        let html = '', grandTotal = 0;

        if (type === 'all') {
            html = '<div style="max-height: 200px; overflow-y: auto;">';
            [...filtered].reverse().forEach(s => {
                html += `<div style="border-bottom:1px solid #eee; padding:4px 0;"><strong>第${s.id}セット</strong> (${s.time})<br>合計: <strong>${s.total}点</strong></div>`;
            });
            html += '</div>';
            showAlert('全履歴確認', html);
        } else {
            const count = filtered.length;
            filtered.forEach(s => grandTotal += s.total);
            const avg = (grandTotal / count).toFixed(1);
            const titleMap = { 'recent': '直近10セット', 'month': '今月の成績', 'year': '今年の成績' };
            html = `集計セット数: <strong>${count}セット</strong><br>合計得点: <strong>${grandTotal}点</strong><br>平均得点: <strong>${avg}点</strong>`;
            showAlert(titleMap[type], html);
        }
    }

    function startNewSet() {
        const nextId = sets.length + 1;
        const now = new Date();
        const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        const newSet = {
            id: nextId,
            time: timeStr,
            scores: [
                [null, null, null, null, null],
                [null, null, null, null, null],
                [null, null, null, null, null],
                [null, null, null, null, null],
                [null, null, null, null, null],
                [null, null, null, null, null]
            ],
            total: 0
        };
        sets.push(newSet);
        saveData();
        render();
    }

    function deleteSet(index) {
        if (confirm('このセットを削除しますか？')) {
            sets.splice(index, 1);
            sets.forEach((s, i) => s.id = i + 1);
            saveData();
            render();
        }
    }

    function setScore(setIndex, rIndex, aIndex, score) {
        if (sets[setIndex].scores[rIndex][aIndex] === score) {
            sets[setIndex].scores[rIndex][aIndex] = null;
        } else {
            sets[setIndex].scores[rIndex][aIndex] = score;
        }

        let setTotal = 0;
        sets[setIndex].scores.forEach(r => {
            r.forEach(s => { if (s !== null) setTotal += s; });
        });
        sets[setIndex].total = setTotal;

        saveData();
        render();
    }

    function render() {
        const area = document.getElementById('cardsArea');
        area.innerHTML = '';
        if (sets.length === 0) return;

        [...sets].reverse().forEach((set) => {
            const realIndex = sets.findIndex(s => s.id === set.id);
            const card = document.createElement('div');
            card.className = 'card';

            let cardHtml = `
                <div class="card-header">
                    <div class="card-title">第${set.id}セット <span style="font-size:0.75rem; color:var(--text-sub); font-weight:normal;">(${set.time})</span></div>
                    <button class="btn-close" onclick="deleteSet(${realIndex})">×</button>
                </div>
            `;

            set.scores.forEach((round, rIndex) => {
                let rTotal = round.reduce((a, b) => a + (b !== null ? b : 0), 0);
                cardHtml += `
                    <div class="round-row">
                        <span class="round-label">R${rIndex + 1}</span>
                        <div class="arrows-container">
                `;

                round.forEach((score, aIndex) => {
                    const options = [7, 5, 3, 1, 0];
                    cardHtml += `<div class="arrow-group">`;
                    options.forEach(opt => {
                        const active = (score === opt) ? 'active' : '';
                        cardHtml += `<button class="btn-score ${active}" onclick="setScore(${realIndex}, ${rIndex}, ${aIndex}, ${opt})">${opt}</button>`;
                    });
                    cardHtml += `</div>`;
                });

                cardHtml += `
                        </div>
                        <span class="round-total">${rTotal}</span>
                    </div>
                `;
            });

            cardHtml += `
                <div class="set-total-box">
                    セット合計: ${set.total} 点
                </div>
            `;

            card.innerHTML = cardHtml;
            area.appendChild(card);
        });
    }

    loadData();
    render();
</script>

</body>
</html>
